<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audixa — Audio, Transcript & Chapter Editor</title>
  <meta name="description" content="Simultaneous multi-panel editor for synchronized audio playback, transcript editing, and chapter generation.">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
  <!-- WaveSurfer.js CDN for Audio Waveform Sync -->
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 14px;">
        <a href="/" class="btn btn-secondary btn-sm" title="Back to Upload Page">
          ← Upload New
        </a>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 20px;">🎙️</span>
          <h2 id="media-filename" class="logo-text" style="font-size: 1.05rem; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            Loading Transcript...
          </h2>
        </div>
      </div>

      <div class="header-meta">
        <span id="lang-badge" class="badge badge-primary">Hinglish / Auto</span>

        <!-- Export Dropdown -->
        <div class="dropdown-wrapper">
          <button type="button" id="export-btn" class="btn btn-secondary btn-sm">
            Export ▼
          </button>
          <div id="export-dropdown" class="dropdown-menu">
            <button class="dropdown-item" data-export="txt">📄 Plain Text (.txt)</button>
            <button class="dropdown-item" data-export="srt">⏱️ Subtitles (.srt)</button>
            <button class="dropdown-item" data-export="vtt">🌐 WebVTT (.vtt)</button>
            <button class="dropdown-item" data-export="youtube">🔴 YouTube Timestamps</button>
            <button class="dropdown-item" data-export="json">📦 Full JSON (.json)</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 3-Panel Synchronized Editor Layout -->
    <main class="editor-layout">
      
      <!-- LEFT COLUMN: Section A (Audio Player) + Section C (Chapter Maker) -->
      <div class="editor-left-col">
        
        <!-- SECTION A: Audio Player -->
        <section class="card-panel player-panel">
          <div class="player-header">
            <div class="player-title">🔊 Audio Player & Waveform</div>
            <div id="active-time-label" style="font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; color: var(--primary);">
              00:00 / 00:00
            </div>
          </div>

          <!-- Waveform Display Box -->
          <div class="waveform-box">
            <div id="waveform"></div>
            <audio id="native-audio" preload="auto" style="display: none;"></audio>
            
            <div class="time-display-row">
              <span id="current-time-display">00:00</span>
              <span id="total-duration-display">00:00</span>
            </div>
          </div>

          <!-- Controls Bar -->
          <div class="player-controls">
            <div class="playback-btn-group">
              <button type="button" id="play-pause-btn" class="btn-play-pause" title="Play/Pause">
                <span id="play-icon">▶</span>
                <span id="pause-icon" style="display: none;">⏸</span>
              </button>
            </div>

            <!-- Speed & Volume -->
            <div style="display: flex; align-items: center; gap: 10px;">
              <select id="playback-speed" class="speed-selector" title="Playback Speed">
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
              </select>

              <div class="volume-control" title="Volume">
                <span style="font-size: 0.8rem; color: var(--text-muted);">🔊</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
              </div>
            </div>
          </div>
        </section>

        <!-- SECTION C: Chapter Maker -->
        <section class="card-panel chapters-panel">
          <div class="panel-top-bar">
            <div class="panel-heading">
              <span>📑 Chapters</span>
              <span id="chapter-count-badge" class="badge badge-primary" style="font-size: 0.72rem;">0</span>
            </div>

            <button type="button" id="add-chapter-btn" class="btn btn-primary btn-sm" title="Add chapter at current time">
              + Add at <span id="add-chapter-time-hint" style="font-family: var(--font-mono);">00:00</span>
            </button>
          </div>

          <!-- Scrollable Chapters -->
          <div id="chapters-list" class="chapters-scroll-area">
            <div style="color: var(--text-dim); text-align: center; padding: 25px 10px; font-size: 0.88rem;">
              Loading chapters...
            </div>
          </div>

          <!-- Save Chapters Action -->
          <div style="display: flex; justify-content: flex-end; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border-color); flex-shrink: 0;">
            <button type="button" id="manual-save-chapters-btn" class="btn btn-secondary btn-sm">
              Save Chapters
            </button>
          </div>
        </section>

      </div>

      <!-- RIGHT COLUMN: Section B (Interactive Transcript) -->
      <section class="card-panel transcript-panel">
        <div class="panel-top-bar">
          <div class="panel-heading">
            <span>📝 Interactive Transcript</span>
            <span id="segment-count-badge" class="badge" style="font-size: 0.72rem;">0 segments</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <button type="button" id="manual-save-transcript-btn" class="btn btn-primary btn-sm">
              Save Transcript
            </button>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="transcript-search-bar">
          <span style="color: var(--text-dim);">🔍</span>
          <input type="text" id="transcript-search-input" placeholder="Search spoken words or phrases...">
          <span id="search-match-count" style="font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono);"></span>
        </div>

        <!-- Scrollable Segments -->
        <div id="transcript-list" class="transcript-scroll-area">
          <div style="color: var(--text-dim); text-align: center; padding: 30px 10px; font-size: 0.9rem;">
            Loading transcript segments...
          </div>
        </div>
      </section>

    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

  </div>

  <script src="/static/js/editor.js"></script>
</body>
</html>
